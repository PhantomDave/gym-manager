<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestione Palestra</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Everything is rendered by Preact. The lang attribute is rewritten by
         i18n.setLanguage() so assistive technology follows the chosen language. -->
    <div id="app"></div>
    <!-- Loaded first and on purpose: it turns a failed boot into a message
         instead of an empty window. See src/boot.js. -->
    <script src="boot.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
