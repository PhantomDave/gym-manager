[package]
name = "gym-manager"
version = "0.1.0"
description = "Membership, health certificate and document desk for a small gym"
authors = ["PhantomDave"]
license = "MIT"
repository = "https://github.com/PhantomDave/gym-manager"
edition = "2021"
rust-version = "1.82"

[lib]
name = "gym_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = "2.11.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
thiserror = "2.0.20"

[build-dependencies]
tauri-build = "2.6.3"

# Tuned for size, not compile speed: the target machine has 2 GB of RAM and a
# smaller binary means less to page in.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
