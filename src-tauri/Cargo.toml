[package]
name = "gym-manager"
version = "0.2.4"
description = "Membership, health certificate and document desk for a small gym"
authors = ["PhantomDave"]
license = "MIT"
repository = "https://github.com/PhantomDave/gym-manager"
edition = "2021"
rust-version = "1.90"

[lib]
name = "gym_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
thiserror = "2.0.21"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

# Tuned for size, not compile speed: this app should be as lightweight as
# possible, and a smaller binary means less to page in.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
ts-rs = "12.0.1"
