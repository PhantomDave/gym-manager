name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the bundles but do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build the .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tag is the source of truth for the version. A mismatch would ship a
      # bundle whose filename disagrees with the release it is attached to.
      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi

      # Prebuilt binary rather than `cargo install tauri-cli`, which would spend
      # several minutes compiling the CLI on every release.
      - uses: cargo-bins/cargo-binstall@v1.23.0

      - name: Install the Tauri CLI
        run: cargo binstall -y --locked tauri-cli@^2

      - name: Build bundles
        working-directory: src-tauri
        run: cargo tauri build --bundles deb

      # NOT dist/: that is the frontend's build output, and collecting here
      # would make the guard below count app.js and index.html — it would pass
      # with zero bundles produced.
      - name: Collect bundles
        id: collect
        run: |
          mkdir -p release-artifacts
          find src-tauri/target/release/bundle -type f -name '*.deb' \
            -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts
          echo "count=$(find release-artifacts -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Fail if nothing was produced
        run: test "${{ steps.collect.outputs.count }}" -gt 0

      - uses: actions/upload-artifact@v7
        with:
          name: gym-manager-linux
          path: release-artifacts/*
          retention-days: 14

  windows:
    name: Build the Windows installer
    runs-on: windows-latest
    # Several steps below are written in bash syntax ($GITHUB_OUTPUT, find);
    # windows-latest defaults to PowerShell otherwise.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi

      - uses: cargo-bins/cargo-binstall@v1.23.0

      - name: Install the Tauri CLI
        run: cargo binstall -y --locked tauri-cli@^2

      # NSIS, not MSI: it's the target the Tauri docs lead with and needs no
      # extra system dependency — the bundler fetches makensis itself.
      - name: Build bundles
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Collect bundles
        id: collect
        run: |
          mkdir -p release-artifacts
          find src-tauri/target/release/bundle -type f -name '*.exe' \
            -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts
          echo "count=$(find release-artifacts -name '*.exe' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Fail if nothing was produced
        run: test "${{ steps.collect.outputs.count }}" -gt 0

      - uses: actions/upload-artifact@v7
        with:
          name: gym-manager-windows
          path: release-artifacts/*
          retention-days: 14

  macos:
    name: Build the macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi

      - uses: cargo-bins/cargo-binstall@v1.23.0

      - name: Install the Tauri CLI
        run: cargo binstall -y --locked tauri-cli@^2

      # dmg, not app: a .app alone has no install step for the user to run.
      # Unsigned — there is no Apple Developer ID configured — so Gatekeeper
      # will refuse to open it until the user right-clicks > Open once.
      - name: Build bundles
        working-directory: src-tauri
        run: cargo tauri build --bundles dmg

      - name: Collect bundles
        id: collect
        run: |
          mkdir -p release-artifacts
          find src-tauri/target/release/bundle -type f -name '*.dmg' \
            -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts
          echo "count=$(find release-artifacts -name '*.dmg' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Fail if nothing was produced
        run: test "${{ steps.collect.outputs.count }}" -gt 0

      - uses: actions/upload-artifact@v7
        with:
          name: gym-manager-macos
          path: release-artifacts/*
          retention-days: 14

  # Published as a draft on purpose: someone should install each bundle on a
  # real machine of that OS and open it once before this reaches a deployment.
  # Neither the Windows nor the macOS bundle gets that check here — CI only
  # proves they were produced, not that they render. See DECISIONS.md.
  publish:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: gym-manager-*
          merge-multiple: true

      - run: ls -lhR release-artifacts

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: release-artifacts/*
          body: |
            Install on Debian-based distributions:

            ```bash
            sudo apt install ./gym-manager_*_amd64.deb
            ```

            Data lives in `~/.local/share/dev.phantomdave.gymmanager/`
            (`gym.db`, `docs/`, `backups/`). Back that folder up before upgrading.

            No AppImage: it bundles the build host's graphics stack and fails
            with `EGL_BAD_PARAMETER` on systems whose mesa differs. The .deb
            links against the system WebKitGTK, which is the configuration that
            works. See DECISIONS.md.

            ---

            **Windows** (`.exe`, NSIS installer) and **macOS** (`.dmg`) builds
            are new and are **not signed** and **not verified on screen** —
            CI only confirms that the bundle was produced, the same way the
            Linux build is confirmed by `scripts/smoke.py` inside WebKitGTK,
            but neither Windows nor macOS has an equivalent smoke test yet.

            - **Windows**: SmartScreen will warn that the app is from an
              unrecognized publisher ("More info" → "Run anyway").
            - **macOS**: Gatekeeper will refuse to open it the first time.
              Right-click the app → Open, once, to bypass it.

            Install one of these on a real machine before trusting it for
            anything more than a look.
