name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: types, bundle and smoke test
    # Linux only, deliberately: this is the one job that boots the real
    # rendering engine (WebKitGTK) instead of trusting that a build succeeded.
    # There is no WebView2/WKWebView equivalent of scripts/smoke.py, so
    # Windows and macOS builds below are verified by "the bundle was
    # produced", not by anything drawing on screen. See DECISIONS.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # tsc is the real check; bun build only strips types and would happily
      # bundle code that does not typecheck.
      - name: Type check
        run: bun run check

      - name: Build bundle
        run: bun run build

      # The app ships on WebKitGTK, not Chromium. A bundle that renders in a
      # Chromium tab can still leave a black window on the desk, so this boots
      # dist/ in the real engine and fails if nothing draws.
      # python3-gi-cairo is what lets the smoke test read the rendered pixels
      # back: a <select> can be painted by the platform over the top of the
      # stylesheet, and computed styles report our colour while the operator
      # sees the engine's. Without it that half of the check is skipped, loudly.
      - name: Install WebKitGTK and a display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 xvfb

      - name: Smoke-test the frontend in WebKitGTK
        run: xvfb-run -a python3 scripts/smoke.py

  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    # No glibc pin anymore: ubuntu-latest/windows-latest/macos-latest, for
    # consistency across the matrix. This deliberately gives up the old
    # guarantee that the Linux build links against the oldest glibc we
    # support — see DECISIONS.md for what that trade-off was and what to do
    # if it ever bites.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Several steps below (seed script, $GITHUB_OUTPUT) are written in
        # bash syntax; Windows runners default to PowerShell otherwise.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # generate_context! reads frontendDist at COMPILE time, so the bundle has
      # to exist before clippy or cargo test touch the lib — not only before a
      # release build, where beforeBuildCommand would have handled it.
      - name: Build frontend bundle
        run: bun run build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all-features

      # The seeder builds its rows against the shipped migrations. A new NOT
      # NULL column or a renamed table breaks it, and nobody finds out until
      # they try to demo the app. It verifies its own output and exits
      # non-zero, so running it is the whole check.
      - name: Demo seed script must still match the schema
        run: python3 scripts/seed.py --db "$RUNNER_TEMP/demo/gym.db"

      # Catches a broken tauri.conf.json, a capability referencing a permission
      # that does not exist, or a missing icon — none of which the test suite
      # would notice, because they only fail when the context is generated.
      - name: Build
        working-directory: src-tauri
        run: cargo build

  versions:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 'Office' looked obviously right and is rejected by the bundler, which
      # only finds out three minutes into a release build. Check it in seconds.
      - name: Bundle category must be one the bundler accepts
        run: |
          category=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['bundle'].get('category',''))")
          valid="business developertool education entertainment finance game graphicsanddesign healthcareandfitness lifestyle medical music news photography productivity reference socialnetworking sports travel utility video weather"
          echo "category: $category"
          if ! echo "$valid" | tr ' ' '\n' | grep -qx "$(echo "$category" | tr '[:upper:]' '[:lower:]')"; then
            echo "::error::'$category' is not a Tauri AppCategory. One of: $valid"
            exit 1
          fi

      - name: Cargo.toml and tauri.conf.json must agree
        run: |
          cargo_version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          tauri_version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "Cargo.toml:      $cargo_version"
          echo "tauri.conf.json: $tauri_version"
          if [ "$cargo_version" != "$tauri_version" ]; then
            echo "::error::version mismatch — the bundle would be named differently from the crate"
            exit 1
          fi
