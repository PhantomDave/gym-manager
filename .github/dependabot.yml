version: 2

# Every ecosystem in the repository is covered: the Rust crate, the frontend's
# npm packages, and the actions the workflows use. An ecosystem left out here
# is one that silently stops receiving security updates.
#
# Grouping strategy: patch and minor releases arrive as one PR per ecosystem per
# week, because reviewing fifteen separate bumps is how bumps stop getting
# reviewed. Majors stay separate — those are the ones that need a human reading
# a changelog.

updates:
  # --- Rust -----------------------------------------------------------------
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "build(cargo)"
    groups:
      # Tauri's crates move in lockstep; separate PRs for each would not build.
      tauri:
        patterns:
          - tauri
          - tauri-*
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - tauri
          - tauri-*

  # --- Frontend -------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "build(npm)"
    # Keep the manifest range in step with the lockfile, so package.json always
    # states the version actually installed.
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # --- CI -------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
